services:

  sentinel-backend:
    build: ./sentinel
    # Pre-built images are published to GitHub's container registry by
    # .github/workflows/publish-images.yml, so `docker compose pull` works with
    # no setup. `docker compose build` still builds from source under the same
    # name. To use a different registry, set HEIMDALL_REGISTRY in .env.
    image: ${HEIMDALL_REGISTRY:-ghcr.io/danielonet/heimdall}/sentinel-backend:${IMAGE_TAG:-latest}
    network_mode: host          # must reach router AND sniff ARP on LAN
    cap_add:
      - NET_RAW                 # required by Scapy for ARP packet sniffing
      - NET_ADMIN               # required for network interface operations
    environment:
      - ROUTER_ADAPTER=sagemcom
      - ROUTER_IP=              # blank = auto-discover from default route
      - ROUTER_PORT=80
      - ROUTER_USERNAME=home
      - ROUTER_PASSWORD_FILE=/run/secrets/router_password
      # - USE_MOCK_ROUTER=true   # enable for offline dev (synthetic test data)
      # Optional second router — a Redmi/Xiaomi unit on stock MiWiFi
      # firmware (see sentinel/adapter/miwifi/). Blank MIWIFI_IP means "not
      # configured"; both can also be set/changed later from the Settings
      # tab without editing this file. See docs/router/miwifi-api.md.
      - MIWIFI_IP=
      - MIWIFI_PASSWORD_FILE=/run/secrets/miwifi_password
      - ROUTER_SECRETS_DIR=/run/secrets/routers
      # - USE_MOCK_MIWIFI=true   # enable for offline dev (synthetic test data)
      - DATABASE_URL=postgresql+asyncpg://sentinel:${DB_PASS}@localhost/sentinel
      - REDIS_URL=redis://localhost:6379
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - OTX_API_KEY_FILE=/run/secrets/otx_api_key
      - ADMIN_PASSWORD_FILE=/run/secrets/admin_password
      - ABUSECH_AUTH_KEY_FILE=/run/secrets/abusech_auth_key
      - THREAT_FEED_CACHE_DIR=/data/feeds
      - SMTP_PASSWORD_FILE=/run/secrets/smtp_password
      - SNIFF_IFACE=${SNIFF_IFACE:-eth0}   # LAN-facing interface on monitoring machine
      - POLL_INTERVAL_SECONDS=15
      # minimal | intermediate | full — which optional containers below this
      # install actually runs; must match whatever --profile was used to
      # bring the stack up. See sentinel/deployment_tiers.py and
      # scripts/install.sh --tier.
      - DEPLOYMENT_TIER=${DEPLOYMENT_TIER:-full}
    secrets:
      - jwt_secret
      - otx_api_key
      - db_pass
      - admin_password
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    volumes:
      # The three secrets an admin can change from the Settings tab are
      # bind-mounted read-write at the same /run/secrets/ paths instead of
      # going through Docker's `secrets:` (which is always read-only, so
      # saving a password there failed with a 500). Still file-based, still
      # never in the database or environment. scripts/install.sh creates all
      # three files up front — if one were missing Docker would create a
      # *directory* at that path.
      - ./secrets/router_password.txt:/run/secrets/router_password
      - ./secrets/smtp_password.txt:/run/secrets/smtp_password
      - ./secrets/miwifi_password.txt:/run/secrets/miwifi_password
      - ./secrets/routers:/run/secrets/routers   # one <router-id>.txt per router picked on the Equipment tab
      - ./secrets/abusech_auth_key.txt:/run/secrets/abusech_auth_key   # entered from the Threats tab
      - threat-feeds:/data/feeds      # last good copy of the URLhaus export (cache)
      - ml-models:/data/models        # persist trained ML models across restarts
      - opencanary-logs:/var/log/opencanary:ro  # read by OpenCanaryIngester
      - zeek-logs:/var/log/zeek:ro              # read by zeek_parser.py (dns.log/conn.log)
      - zeek-extracted:/var/zeek/extracted:ro   # read by zeek_parser.py, scanned via ClamAV
      - suricata-logs:/var/log/suricata:ro      # read by SuricataEveLogReader (eve.json)

  frontend:
    build: ./frontend
    image: ${HEIMDALL_REGISTRY:-ghcr.io/danielonet/heimdall}/frontend:${IMAGE_TAG:-latest}
    network_mode: host          # so nginx can proxy /api + /socket.io to
                                 # sentinel-backend at 127.0.0.1:5000 without
                                 # CORS (see frontend/nginx.conf) — nginx
                                 # listens on :3000 directly, no port mapping
                                 # needed/possible under host networking
    depends_on:
      - sentinel-backend
    restart: unless-stopped

  postgres:
    image: timescale/timescaledb-ha:pg16
    network_mode: host          # sentinel-backend on host net needs localhost DB
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD_FILE: /run/secrets/db_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    secrets:
      - db_pass
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    network_mode: host
    command: redis-server --save 60 1 --loglevel warning
    restart: unless-stopped

  # WireMock: Mock Sagemcom router XMO API (optional, for testing with recorded responses)
  # Enable this only if you want to test against actual XMO API response formats
  # from a real router (recorded traffic). See docs/architecture/10-mock-router.md
  # Dev/test tooling only — not part of any real installation tier, so it's
  # never started by `docker compose up`, `--profile intermediate`, or
  # `--profile full`; only an explicit `--profile dev` brings it up.
  wiremock:
    image: wiremock/wiremock:3.13.0-alpine
    profiles: ["dev"]
    ports:
      - "8080:8080"             # Admin API + stub responses
    volumes:
      - ./wiremock:/home/wiremock  # stubs, mappings, recordings
    # Stubs live in mappings/<router-id>/ and __files__/<router-id>/ — one
    # folder per router, all served from this one instance (see wiremock/README.md).
    command:
      - --root-dir=/home/wiremock
      - --port=8080
      - --global-response-templating
      - --disable-request-logging
    restart: unless-stopped

  # full tier only — see sentinel/deployment_tiers.py
  suricata:
    image: ${SURICATA_IMAGE:-jasonish/suricata:latest}
    profiles: ["full"]
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    volumes:
      - ./suricata/suricata.yaml:/etc/suricata/suricata.yaml
      - suricata-logs:/var/log/suricata
    command: ["--af-packet=${SNIFF_IFACE:-eth0}"]
    restart: unless-stopped

  # full tier only — depends on zeek's file-extraction watcher for anything
  # to actually scan (see _zeek_file_scan_job in sentinel/scheduler/scheduler.py),
  # so it's never meaningful in intermediate without zeek alongside it.
  clamav:
    image: ${CLAMAV_IMAGE:-clamav/clamav:stable}
    profiles: ["full"]
    ports:
      - "3310:3310"             # TCP socket for pyclamd
    volumes:
      - clamav-db:/var/lib/clamav
    restart: unless-stopped

  # intermediate + full — the one lightweight, dependency-free optional
  # container: idle socket listeners only, no packet inspection, no
  # signature database. See docs/deployment-tiers-plan.md.
  opencanary:
    image: ${OPENCANARY_IMAGE:-thinkst/opencanary:latest}
    profiles: ["intermediate", "full"]
    network_mode: host          # must appear as a real LAN device
    volumes:
      - ./opencanary/opencanary.conf:/etc/opencanaryd/opencanary.conf:ro
      - opencanary-logs:/var/log/opencanary
    restart: unless-stopped

  # full tier only — see sentinel/deployment_tiers.py
  zeek:
    image: ${ZEEK_IMAGE:-zeek/zeek:latest}
    profiles: ["full"]
    network_mode: host          # must sniff the same LAN traffic as arp_watch/opencanary/suricata
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      # Must match docs/router/network-topology.md's Subnet — without this,
      # Zeek's file-analysis framework can't tell which connection endpoint
      # is "local", so files.log's tx_hosts/rx_hosts stay empty and
      # ZeekFileExtractionWatcher can never attribute an extracted file back
      # to the LAN device that downloaded it. See zeek/local.zeek.
      - LAN_SUBNET=${LAN_SUBNET:-10.100.102.0/24}
    volumes:
      - ./zeek/local.zeek:/usr/local/zeek/share/zeek/site/local.zeek:ro
      - zeek-logs:/var/log/zeek
      - zeek-extracted:/var/zeek/extracted
    # Run standalone (no zeekctl) — logs land directly in the working
    # directory with no automatic timestamped rotation, unlike a zeekctl
    # deployment. See sentinel/security/zeek_parser.py's truncation-safety
    # comment for why the reader still defends against the file shrinking
    # anyway (e.g. a container restart recreating the log fresh).
    working_dir: /var/log/zeek
    command: ["zeek", "-i", "${SNIFF_IFACE:-eth0}", "local"]
    restart: unless-stopped

secrets:
  jwt_secret:      { file: ./secrets/jwt_secret.txt }
  otx_api_key:     { file: ./secrets/otx_api_key.txt }
  db_pass:         { file: ./secrets/db_pass.txt }
  admin_password:  { file: ./secrets/admin_password.txt }
  # router_password, smtp_password, miwifi_password and abusech_auth_key are
  # deliberately NOT here: the Settings / Threats tabs rewrite them, so
  # sentinel-backend bind-mounts them read-write instead (see its `volumes:`).

volumes:
  pgdata:
  ml-models:
  threat-feeds:
  suricata-logs:
  clamav-db:
  opencanary-logs:
  zeek-logs:
  zeek-extracted:

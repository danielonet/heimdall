services:

  sentinel-backend:
    build: ./sentinel
    network_mode: host          # must reach router AND sniff ARP on LAN
    cap_add:
      - NET_RAW                 # required by Scapy for ARP packet sniffing
      - NET_ADMIN               # required for network interface operations
    environment:
      - ROUTER_ADAPTER=sagemcom
      - ROUTER_IP=              # blank = auto-discover from default route
      - ROUTER_PORT=80
      - ROUTER_USERNAME=home
      - ROUTER_PASSWORD_FILE=/run/secrets/router_password
      # - USE_MOCK_ROUTER=true   # enable for offline dev (synthetic test data)
      - DATABASE_URL=postgresql+asyncpg://sentinel:${DB_PASS}@localhost/sentinel
      - REDIS_URL=redis://localhost:6379
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - OTX_API_KEY_FILE=/run/secrets/otx_api_key
      - ADMIN_PASSWORD_FILE=/run/secrets/admin_password
      - SNIFF_IFACE=${SNIFF_IFACE:-eth0}   # LAN-facing interface on monitoring machine
      - POLL_INTERVAL_SECONDS=15
    secrets:
      - router_password
      - jwt_secret
      - otx_api_key
      - db_pass
      - admin_password
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    volumes:
      - ml-models:/data/models        # persist trained ML models across restarts
      - opencanary-logs:/var/log/opencanary:ro  # read by OpenCanaryIngester
      - zeek-logs:/var/log/zeek:ro              # read by zeek_parser.py (dns.log/conn.log)
      - zeek-extracted:/var/zeek/extracted:ro   # read by zeek_parser.py, scanned via ClamAV

  frontend:
    build: ./frontend
    network_mode: host          # so nginx can proxy /api + /socket.io to
                                 # sentinel-backend at 127.0.0.1:5000 without
                                 # CORS (see frontend/nginx.conf) — nginx
                                 # listens on :3000 directly, no port mapping
                                 # needed/possible under host networking
    depends_on:
      - sentinel-backend
    restart: unless-stopped

  postgres:
    image: timescale/timescaledb-ha:pg16
    network_mode: host          # sentinel-backend on host net needs localhost DB
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD_FILE: /run/secrets/db_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    secrets:
      - db_pass
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    network_mode: host
    command: redis-server --save 60 1 --loglevel warning
    restart: unless-stopped

  # WireMock: Mock Sagemcom router XMO API (optional, for testing with recorded responses)
  # Enable this only if you want to test against actual XMO API response formats
  # from a real router (recorded traffic). See docs/architecture/10-mock-router.md
  wiremock:
    image: wiremock/wiremock:3.x-alpine
    ports:
      - "8080:8080"             # Admin API + stub responses
    volumes:
      - ./wiremock:/home/wiremock  # stubs, mappings, recordings
    command:
      - --root-dir=/home/wiremock
      - --port=8080
      - --disable-request-logging
    restart: unless-stopped

  suricata:
    image: jasonish/suricata:latest
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_NICE
    volumes:
      - ./suricata/suricata.yaml:/etc/suricata/suricata.yaml
      - suricata-logs:/var/log/suricata
    command: ["--af-packet=${SNIFF_IFACE:-eth0}"]
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable
    ports:
      - "3310:3310"             # TCP socket for pyclamd
    volumes:
      - clamav-db:/var/lib/clamav
    restart: unless-stopped

  opencanary:
    image: thinkst/opencanary:latest
    network_mode: host          # must appear as a real LAN device
    volumes:
      - ./opencanary/opencanary.conf:/etc/opencanaryd/opencanary.conf:ro
      - opencanary-logs:/var/log/opencanary
    restart: unless-stopped

  zeek:
    image: zeek/zeek:latest
    network_mode: host          # must sniff the same LAN traffic as arp_watch/opencanary/suricata
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      # Must match docs/router/network-topology.md's Subnet — without this,
      # Zeek's file-analysis framework can't tell which connection endpoint
      # is "local", so files.log's tx_hosts/rx_hosts stay empty and
      # ZeekFileExtractionWatcher can never attribute an extracted file back
      # to the LAN device that downloaded it. See zeek/local.zeek.
      - LAN_SUBNET=${LAN_SUBNET:-10.100.102.0/24}
    volumes:
      - ./zeek/local.zeek:/usr/local/zeek/share/zeek/site/local.zeek:ro
      - zeek-logs:/var/log/zeek
      - zeek-extracted:/var/zeek/extracted
    # Run standalone (no zeekctl) — logs land directly in the working
    # directory with no automatic timestamped rotation, unlike a zeekctl
    # deployment. See sentinel/security/zeek_parser.py's truncation-safety
    # comment for why the reader still defends against the file shrinking
    # anyway (e.g. a container restart recreating the log fresh).
    working_dir: /var/log/zeek
    command: ["zeek", "-i", "${SNIFF_IFACE:-eth0}", "local"]
    restart: unless-stopped

secrets:
  router_password: { file: ./secrets/router_password.txt }
  jwt_secret:      { file: ./secrets/jwt_secret.txt }
  otx_api_key:     { file: ./secrets/otx_api_key.txt }
  db_pass:         { file: ./secrets/db_pass.txt }
  admin_password:  { file: ./secrets/admin_password.txt }

volumes:
  pgdata:
  ml-models:
  suricata-logs:
  clamav-db:
  opencanary-logs:
  zeek-logs:
  zeek-extracted:

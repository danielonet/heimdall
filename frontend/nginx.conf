# Same-origin proxy so the SPA never needs CORS headers from the Flask API
# (sentinel-backend doesn't send any — see sentinel/api/app.py). This container
# runs with network_mode: host in docker-compose.yml specifically so it can
# reach the backend at 127.0.0.1:5000, same as sentinel-backend itself does.
server {
    # 3000, not 80 — this container runs with network_mode: host (see
    # docker-compose.yml), so whatever port nginx binds to here is what's
    # exposed directly on the host; 3000 keeps the existing convention.
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

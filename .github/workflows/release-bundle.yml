name: Release install bundle and .deb

# On a version tag, builds the install bundle (compose file + config + setup.sh)
# and attaches it, its checksum and the bootstrap script to the GitHub Release.
# These fixed file names are what https://heimdall.it.com/install.sh downloads
# from .../releases/latest/download/. The .deb is attached as heimdall_<ver>_all.deb
# and as heimdall_all.deb (stable name, for the website's download button). The matching images are pushed by
# publish-images.yml on the same tag.

on:
  push:
    tags: ['v*']
  # publish-images.yml tags every main build and calls this. A tag pushed with the workflow
  # token does not trigger a push event, so the call is what makes the release happen.
  workflow_call:
    inputs:
      tag:
        description: The version tag to release, e.g. v0.1.6
        required: true
        type: string

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  bundle:
    name: Build and attach the bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Build bundle
        run: OUT_DIR="$RUNNER_TEMP/dist" install/make-bundle.sh "$TAG"

      - name: Build the .deb
        run: OUT_DIR="$RUNNER_TEMP/dist" install/deb/make-deb.sh "$TAG"

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            "$RUNNER_TEMP/dist/heimdall-bundle.tar.gz" \
            "$RUNNER_TEMP/dist/heimdall-bundle.tar.gz.sha256" \
            "$RUNNER_TEMP/dist/install.sh" \
            "$RUNNER_TEMP"/dist/heimdall_*_all.deb \
            "$RUNNER_TEMP"/dist/heimdall_*_all.deb.sha256 \
            "$RUNNER_TEMP/dist/heimdall_all.deb" \
            "$RUNNER_TEMP/dist/heimdall_all.deb.sha256" \
            --title "$TAG" --generate-notes

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:   # lets publish-images.yml run the same checks as a gate

permissions:
  contents: read

# github.workflow is the *caller's* name when this runs via workflow_call, so
# the publish gate and the push-triggered run get different groups. With a
# shared group they cancelled each other and nothing was ever published.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-scripts:
    name: Install scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck install/setup.sh install/get-heimdall.sh install/make-bundle.sh \
            install/deb/make-deb.sh install/deb/heimdall install/deb/postinst install/deb/prerm install/deb/postrm
      - name: Bundle and bootstrap tests
        run: |
          pip install pytest
          pytest tests/test_install -q
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    # The test suite expects the same services docker-compose provides:
    # PostgreSQL + TimescaleDB (migrations call create_hypertable) and Redis.
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: sentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://sentinel:pass@localhost:5432/sentinel
      REDIS_URL: redis://localhost:6379
      # Throwaway value for the API tests' login flow; production reads JWT_SECRET_FILE.
      JWT_SECRET_KEY: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sentinel/requirements.txt
      - name: System packages (Scapy / nmap)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpcap-dev nmap
      - run: pip install -r sentinel/requirements.txt
      - name: Apply database migrations
        run: alembic upgrade head
      - run: pytest -q

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t heimdall-backend-ci ./sentinel
      - run: docker build -t heimdall-frontend-ci ./frontend

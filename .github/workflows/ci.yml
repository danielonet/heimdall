name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:   # lets publish-images.yml run the same checks as a gate

permissions:
  contents: read

# github.workflow is the *caller's* name when this runs via workflow_call, so
# the publish gate and the push-triggered run get different groups. With a
# shared group they cancelled each other and nothing was ever published.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: No secrets in the change
    runs-on: ubuntu-latest
    env:
      # Pinned and checksum-verified: a scanner that fetches "latest" is itself a supply-chain risk.
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - name: Scan the files
        run: ./gitleaks dir . --no-banner --redact
      - name: Scan the commits in this push or pull request
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        # Only the new commits, so an old leak that has been rotated cannot fail every later run.
        # After a force-push the previous tip no longer exists; then only the new tip is scanned.
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$SHA"
          else
            range="-1"
          fi
          echo "Scanning commits: $range"
          ./gitleaks git . --log-opts="$range" --no-banner --redact
  docs-index:
    name: Docs index is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Every document has a row in docs/INDEX.md, and no row is dead
        run: python3 scripts/check-docs-index.py
  install-scripts:
    name: Install scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck install/setup.sh install/get-heimdall.sh install/make-bundle.sh
            install/deb/make-deb.sh install/deb/heimdall install/deb/postinst install/deb/prerm install/deb/postrm
      - name: Bundle and bootstrap tests
        run: |
          pip install pytest
          pytest tests/test_install -q
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    # The test suite expects the same services docker-compose provides:
    # PostgreSQL + TimescaleDB (migrations call create_hypertable) and Redis.
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: sentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://sentinel:pass@localhost:5432/sentinel
      REDIS_URL: redis://localhost:6379
      # Throwaway value for the API tests' login flow; production reads JWT_SECRET_FILE.
      JWT_SECRET_KEY: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sentinel/requirements.txt
      - name: System packages (Scapy / nmap)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpcap-dev nmap
      - run: pip install -r sentinel/requirements.txt
      - name: Apply database migrations
        run: alembic upgrade head
      - run: pytest -q

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t heimdall-backend-ci ./sentinel
      - run: docker build -t heimdall-frontend-ci ./frontend

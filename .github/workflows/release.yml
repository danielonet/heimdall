name: Release

# Push a version tag to publish a release:
#   git tag v0.1.0 && git push origin v0.1.0
#
# 1. builds the sentinel-backend and frontend images (amd64 + arm64) and
#    pushes them to ghcr.io/<owner>/<repo>/<image>:<version> (+ :latest)
# 2. builds heimdall-bundle.tar.gz (scripts/make-bundle.sh) and attaches it,
#    with its .sha256, to a GitHub release — this is what
#    https://heimdall.it.com/install.sh downloads.
#
# Tags with a suffix (v0.2.0-rc1) become pre-releases: they don't move
# :latest or the "latest release" the installer uses by default.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  images:
    name: Image ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: sentinel-backend
            context: ./sentinel
          - image: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # {{version}} drops the leading "v" (v0.1.0 → 0.1.0), matching the
      # IMAGE_TAG that setup.sh and the installer write into .env.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  bundle:
    name: Bundle + GitHub release
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build bundle
        run: ./scripts/make-bundle.sh "${GITHUB_REF_NAME}" "${REGISTRY}"

      - name: Check bundle compose file
        run: |
          tmp="$(mktemp -d)"
          tar -xzf dist/heimdall-bundle.tar.gz -C "$tmp"
          cd "$tmp/heimdall"
          ./setup.sh --tier=full --iface=eth0 --subnet=192.168.1.0/24
          docker compose config --quiet

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=()
          [[ "${GITHUB_REF_NAME}" == *-* ]] && prerelease=(--prerelease)
          gh release create "${GITHUB_REF_NAME}" \
            dist/heimdall-bundle.tar.gz dist/heimdall-bundle.tar.gz.sha256 \
            --title "Heimdall ${GITHUB_REF_NAME}" --generate-notes "${prerelease[@]}"

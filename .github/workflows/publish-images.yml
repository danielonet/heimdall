name: Publish images

# Builds the backend and frontend images and pushes them to GitHub's container
# registry (ghcr.io/<owner>/heimdall/<image>). Runs only on pushes to main and
# on version tags — never on pull requests, so a fork can't publish anything —
# and only after the full CI workflow has passed.
#
# One-time setup (see docs/homelab-deployment.md): after the first run, set each
# package's visibility to Public under your profile -> Packages.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Push ${{ matrix.image }}
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: sentinel-backend
            context: ./sentinel
          - image: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase the image name (registries require it)
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.image }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          # linux/arm64 (Raspberry Pi etc.) can be added here: "linux/amd64,linux/arm64",
          # at the cost of much slower builds because arm64 is emulated.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

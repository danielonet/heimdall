name: Website

# Builds the site on every change to it, and deploys main to heimdall.it.com over SFTP.
# One-time setup (secrets, deploy key, host key): website/README.md.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/images/**'
      - 'docs/router/equipment-facts.json'
      - 'frontend/src/index.css'
      - 'sentinel/adapter/catalog.py'
      - 'install/get-heimdall.sh'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'docs/images/**'
      - 'docs/router/equipment-facts.json'
      - 'frontend/src/index.css'
      - 'sentinel/adapter/catalog.py'
      - 'install/get-heimdall.sh'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the tags give the version shown top right
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install
        working-directory: website
        run: npm ci
      - name: Build
        working-directory: website
        run: npm run build
      - name: Check shell snippets on the install page
        run: |
          grep -ho 'curl -fsSL https://heimdall.it.com/install.sh | bash -s -- --tier=[a-z]*' website/dist/install/index.html | sort -u
          cmp website/public/install.sh install/get-heimdall.sh
      - name: Check that .htaccess is in the build
        run: test -s website/dist/.htaccess
      - name: Check internal links
        working-directory: website
        run: python3 scripts/check-links.py dist
      - name: Check the built site for private data
        working-directory: website
        run: python3 scripts/check-private.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: website/dist
          retention-days: 7
          # Without this the artifact silently drops .htaccess (a dotfile), and the live site loses
          # its HTTPS redirect, security headers and download redirects.
          include-hidden-files: true

  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Check that .htaccess survived the artifact
        run: test -s dist/.htaccess || { echo "::error::dist/.htaccess is missing from the downloaded artifact"; exit 1; }

      - name: Prepare SFTP
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [ -n "$DEPLOY_SSH_KEY" ] && [ -n "$DEPLOY_KNOWN_HOSTS" ] || { echo "::error::DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS must be set (website/README.md)"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        # Makes the web root an exact copy of the build over SFTP (the host has no shell, so no rsync).
        # apt/ is reserved for the package repository and never touched.
        run: website/scripts/deploy-sftp.sh dist

      - name: Smoke test the live site
        run: |
          set -euo pipefail
          base=https://heimdall.it.com
          fail() { echo "::error::$*"; exit 1; }
          headers=$(curl -fsSI "$base/") || fail "site does not answer over HTTPS"
          echo "$headers" | grep -qi '^strict-transport-security:' || fail "HSTS header missing (.htaccess not applied: is mod_headers enabled?)"
          echo "$headers" | grep -qi '^content-security-policy:' || fail "CSP header missing"
          curl -fsSI "$base/install.sh" | grep -qi '^content-type: text/plain' || fail "/install.sh is not served as text/plain"
          curl -fsS "$base/install.sh" | cmp - install/get-heimdall.sh || fail "/install.sh differs from install/get-heimdall.sh"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$base/download/heimdall_all.deb")
          [ "$code" = 302 ] || fail "/download/heimdall_all.deb should redirect (got $code; no release yet?)"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://heimdall.it.com/)
          [ "$code" = 301 ] || fail "plain HTTP should redirect to HTTPS (got $code)"
